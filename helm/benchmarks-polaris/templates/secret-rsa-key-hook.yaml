{{/*
  Pre-install/pre-upgrade hook to generate RSA key pair Secret.
  Secret이 존재하지 않을 때만 생성 (PKCS#8 형식).
*/}}
{{- if eq .Values.authentication.tokenBroker.type "rsa-key-pair" }}
{{- $secretName := .Values.authentication.tokenBroker.secret.name | default "polaris-rsa-key-pair-secret" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polaris.fullname" . }}-rsa-keygen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "polaris.fullname" . }}-rsa-keygen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "polaris.fullname" . }}-rsa-keygen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "polaris.fullname" . }}-rsa-keygen
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "polaris.fullname" . }}-rsa-keygen
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "polaris.fullname" . }}-rsa-keygen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ include "polaris.name" . }}-rsa-keygen
    spec:
      serviceAccountName: {{ include "polaris.fullname" . }}-rsa-keygen
      restartPolicy: Never
      containers:
        - name: keygen
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              # Secret이 이미 존재하면 건너뜀
              if kubectl get secret {{ $secretName }} -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                echo "Secret '{{ $secretName }}' already exists. Skipping."
                exit 0
              fi

              # RSA 키 생성 (PKCS#8 형식)
              openssl genpkey -algorithm RSA -out /tmp/private.pem -pkeyopt rsa_keygen_bits:2048
              openssl rsa -in /tmp/private.pem -pubout -out /tmp/public.pem

              # Secret 생성
              kubectl create secret generic {{ $secretName }} \
                --namespace {{ .Release.Namespace }} \
                --from-file=public.pem=/tmp/public.pem \
                --from-file=private.pem=/tmp/private.pem

              echo "Secret '{{ $secretName }}' created successfully."
{{- end }}
