replicaCount: 1

# Event REST forwarder 포함 커스텀 이미지 (extensions/event-rest-forwarder 가 빌드된 이미지)
image:
  repository: skthynix/polaris
  pullPolicy: IfNotPresent
  tag: "v1.3.0-integration-federation-event-rest"
  configDir: /deployments/config

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  deployedAt: "{{ now | unixEpoch }}"  # helm upgrade 시마다 변경 → rolling restart
podLabels: {}
configMapLabels: {}
revisionHistoryLimit: ~
podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10000
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  ports:
    - name: polaris-http
      port: 8181
      targetPort: 8181
      nodePort: ~
      protocol: ~
  sessionAffinity: ~
  clusterIP: ~
  internalTrafficPolicy: ~
  externalTrafficPolicy: ~
  trafficDistribution: ~
  annotations: {}

managementService:
  type: ClusterIP
  ports:
    - name: polaris-mgmt
      port: 8182
      targetPort: 8182
      nodePort: ~
      protocol: ~
  clusterIP: None
  sessionAffinity: ~
  internalTrafficPolicy: ~
  externalTrafficPolicy: ~
  trafficDistribution: ~
  annotations: {}

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# metrics-server가 클러스터에 설치되어 있어야 작동
# https://polaris.apache.org/in-dev/unreleased/helm-chart/production/#scaling
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# -- Pod을 노드별로 균등 분산 배치
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: polaris

# -- PodDisruptionBudget: 노드 drain 시 최소 가용 Pod 보장
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 1  # maxUnavailable 대신 사용 가능 (둘 중 하나만 설정)

nodeSelector:
  {}
tolerations: []
affinity: {}

# -- Configures the liveness probe for polaris pods.
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 10
  timeoutSeconds: 10
  terminationGracePeriodSeconds: 30

# -- Configures the readiness probe for polaris pods.
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 10
  timeoutSeconds: 10

# -- OPA (Open Policy Agent) 인가 설정
# 참고: https://polaris.apache.org/releases/1.3.0/managing-security/external-pdp/opa/
# TODO[OPA]: DataHub listener e2e 검증 위해 임시 비활성. 복귀 시 아래 두 가지 동시 필요:
#   1) enabled: true 로 변경
#   2) policyUri 의 hostname 을 "opa" -> "benchmarks-opa" 로 수정
#      (실제 svc 이름은 benchmarks-opa.datahub-hynix.svc.cluster.local:8282)
opa:
  enabled: false
  # -- 인가(Authorization) 설정
  authorization:
    # -- 인가 타입: "internal" (Polaris 내장 RBAC) 또는 "opa" (외부 OPA PDP)
    type: opa
    policyUri: "http://benchmarks-opa.datahub-hynix.svc.cluster.local:8282/v1/data/polaris/authz"
    http:
      timeout: "PT2S"
      verifySsl: false

# -- Extra environment variables configuration.
extraEnv:
  # PostgreSQL connection settings (from Secret)
  - name: QUARKUS_DATASOURCE_JDBC_URL
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: jdbcUrl
  - name: QUARKUS_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: username
  - name: QUARKUS_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: password
  # Connection Pool 설정
  - name: QUARKUS_DATASOURCE_JDBC_MIN_SIZE
    value: "10"
  - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
    value: "300"
  - name: QUARKUS_DATASOURCE_JDBC_IDLE_REMOVAL_INTERVAL
    value: "PT2M"
  - name: QUARKUS_DATASOURCE_JDBC_MAX_LIFETIME
    value: "PT30M"
  # Bootstrap credentials (from Secret) - format: REALM,client_id,client_secret
  - name: POLARIS_BOOTSTRAP_CREDENTIALS
    valueFrom:
      secretKeyRef:
        name: polaris-persistence-secret
        key: bootstrapCredentials
  # JVM 설정 (Generational ZGC: 저지연 GC, Java 21+)
  # GC_CONTAINER_OPTIONS: 베이스 이미지의 기본 GC(ParallelGC)를 대체
  # JAVA_TOOL_OPTIONS: 힙 메모리 설정
  - name: GC_CONTAINER_OPTIONS
    value: "-XX:+UseZGC -XX:+ZGenerational"
  - name: JAVA_TOOL_OPTIONS
    value: >-
      -XX:MaxRAMPercentage=65.0
      -XX:InitialRAMPercentage=50.0
  # -- Event REST forwarder 설정 (eventListener.type=rest-forwarder).
  # -- ⚠️ ConfigMap (application.properties) 대신 env vars 로 주입해야 함 — SmallRye Config 의
  # -- quarkus.config.mapping.validate-unknown=true (baked-in default) 가
  # -- runtimeOnly extension 의 @ConfigMapping 을 file source 검증 단계에서 못 찾아서 거부함.
  # -- env vars 는 다른 경로로 처리돼 정상 동작.
  # -- 수신자(receiver) 는 raw EventEnvelope 를 받아 DataHub/Kafka/Atlas 등으로 fan-out 책임을 진다.
  - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_ENDPOINT_URL
    value: "http://fast-api-test.datahub-hynix.svc.cluster.local:8080/polaris/events"
  - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_SYNCHRONOUS_MODE
    value: "false"
  # -- 격리 가드 (RestForwarderConfiguration @WithDefault 와 동일, 명시적 노출용)
  - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_CONNECT_TIMEOUT
    value: "5s"
  - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_REQUEST_TIMEOUT
    value: "10s"
  - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_MAX_INFLIGHT_EMITS
    value: "1000"
  # -- 수신자 인증 token (선택). 인라인 값 대신 Secret 사용 권장:
  # - name: POLARIS_EVENT_LISTENER_REST_FORWARDER_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: polaris-rest-forwarder-token
  #       key: token
  #       optional: true

extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []

# -- Event Listener (감사 로그): 모든 API 작업을 PostgreSQL events 테이블에 기록 (create table)
# -- https://github.com/apache/polaris/blob/apache-polaris-1.3.0-incubating/runtime/service/src/main/java/org/apache/polaris/service/events/listeners/PolarisPersistenceEventListener.java
# -- https://github.com/apache/polaris/blob/apache-polaris-1.3.0-incubating/runtime/service/src/main/java/org/apache/polaris/service/events/listeners/PolarisEventListener.java
eventListener:
  # 가능한 값: no-op, persistence-in-memory-buffer, aws-cloudwatch, rest-forwarder
  # rest-forwarder 는 polaris-extensions-event-rest-forwarder 가 빌드된 이미지에서만 동작.
  # ⚠️ forwarder 세부 설정 (endpoint-url, token 등) 은 extraEnv 의
  #    POLARIS_EVENT_LISTENER_REST_FORWARDER_* env vars 로 주입됨 (SmallRye Config 의
  #    validate-unknown 이 file source 의 keys 를 거부하기 때문).
  type: rest-forwarder
  persistenceBuffer:
    bufferTime: PT5S        # type=persistence-in-memory-buffer 사용 시
    maxBufferSize: 1000

# -- Tracing configuration.
tracing:
  enabled: false
  endpoint: "http://otlp-collector:4317"
  sample: "1.0d"
  attributes:
    {}

# -- Metrics configuration.
metrics:
  enabled: true
  tags:
    application: polaris

# -- ServiceMonitor: Prometheus Operator가 메트릭을 수집할 수 있도록 설정
serviceMonitor:
  enabled: true
  interval: "30s"
  labels:
    release: prometheus
  metricRelabelings: []

# -- Logging configuration
# 참고: https://polaris.apache.org/releases/1.3.0/configuration/
#      https://quarkus.io/guides/logging
logging:
  level: INFO  # 루트 로그 레벨 (QUARKUS_LOG_LEVEL)
  requestIdHeaderName: Polaris-Request-Id
  console:
    enabled: true
    threshold: DEBUG
    json: false
    format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n"
  file:
    enabled: false
    threshold: INFO
    json: false
    format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n"
    logsDir: /deployments/logs
    fileName: polaris.log
    rotation:
      maxFileSize: 10Mi
      maxBackupIndex: 5
      fileSuffix: ~  # .yyyy-MM-dd.gz
    storage:
      className: standard
      size: 5Gi
      selectorLabels: {}
  # 카테고리별 로그 레벨
  categories:
    io.polaris: INFO
    io.polaris.service: INFO
    io.polaris.core: INFO
    org.apache.polaris: INFO
    org.apache.iceberg.rest: INFO
    org.apache.hc.client5.http: INFO
    
    # Credential Vending / STS 관련 로그
    #org.apache.polaris.service.storage: DEBUG
    #org.apache.polaris.core.storage: DEBUG
    #org.apache.iceberg.aws.s3: DEBUG
    #software.amazon.awssdk.services.sts: DEBUG
    #software.amazon.awssdk: DEBUG
  mdc: {}

# -- Realm context resolver configuration.
realmContext:
  type: default
  requireHeader: true  # 프로덕션 환경에서는 realm 헤더를 필수로 요구
  realms:
    - POLARIS

# -- Polaris features configuration.
features:
  # SUPPORTED_CATALOG_STORAGE_TYPES:
  #   - S3
  #   - GCS
  #   - AZURE
  #   - FILE
  realmOverrides: {}
  ALLOW_OVERLAPPING_CATALOG_URLS: true
  # HMS federation 관련 feature 키 (ENABLE_CATALOG_FEDERATION,
  # SUPPORTED_CATALOG_CONNECTION_TYPES, SUPPORTED_EXTERNAL_CATALOG_AUTHENTICATION_TYPES,
  # SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION) 은 아래 `hiveFederation` 블록이 켜졌을 때만
  # configmap 템플릿이 자동으로 추가함 — 여기 직접 넣지 말 것.

# -- HMS (Hive Metastore) federation.
# -- 켜면 chart 가 (1) polaris-hive-conf ConfigMap 을 생성하고 (2) /etc/polaris/hadoop-conf 에
# -- 마운트하며 (3) 필요한 feature 키와 env 를 자동 주입한다. 끄면 어떤 리소스도 만들지 않으므로
# -- HMS 가 없는 환경에서도 helm install 이 깨지지 않는다.
hiveFederation:
  enabled: true
  # HMS thrift endpoint (in-cluster DNS)
  metastoreUri: thrift://hms-hms-minio-spark-hive-metastore.datahub-hynix:9083
  s3:
    # 페더레이션 대상 테이블의 object storage endpoint (HMS warehouse 에서 사용하는 minio)
    endpoint: http://benchmarks-minio.datahub-hynix:9000
    pathStyleAccess: true
    # -- 자격증명 처리 두 경로:
    # -- (A) 비워두면: chart 가 minio.enabled 로 주입한 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # --     env 를 S3AFileSystem 의 EnvironmentVariableCredentialsProvider 가 사용. federation 대상
    # --     S3 와 Polaris 내부 catalog S3 가 같은 cluster minio 인 경우.
    # -- (B) 채우면: 아래 두 값이 hive-federation-configmap 의 core-site.xml 의 fs.s3a.access.key /
    # --     fs.s3a.secret.key 로 박힘. federation 대상이 *다른* S3 (외부 AWS, 다른 사내 MinIO 등)
    # --     일 때 사용. ⚠️ ConfigMap 평문 저장이므로 운영 환경에선 Secret + envFrom 패턴 권장.
    accessKeyId: "minioadmin"
    secretAccessKey: "minioadmin"

# -- Polaris persistence configuration.
persistence:
  type: relational-jdbc
  relationalJdbc:
    # -- Set to true to create the persistence secret during helm install
    createSecret: true
    secret:
      name: polaris-persistence-secret
      username: polaris
      password: polaris
      jdbcUrl: jdbc:postgresql://benchmarks-postgresql:5432/polaris
      # -- Bootstrap credentials format: REALM,client_id,client_secret
      # -- 프로덕션에서는 'polaris-secret'을 안전한 랜덤 문자열로 변경해야 합니다.
      bootstrapCredentials: POLARIS,root,polaris-secret

# -- Polaris FileIO configuration.
fileIo:
  type: default

storage:
  secret:
    name: ~

# -- Polaris authentication configuration.
# -- type: mixed (내부 토큰 우선, 실패 시 외부 OIDC 폴백)
# -- https://polaris.apache.org/releases/1.3.0/managing-security/external-idp/
authentication:
  type: mixed
  authenticator:
    type: default
  tokenService:
    type: default
  tokenBroker:
    type: rsa-key-pair
    maxTokenGeneration: PT1H
    # -- RSA key pair: Helm pre-install hook이 Secret을 자동 생성 (PKCS#8 형식)
    # -- Secret이 이미 존재하면 재생성하지 않음
    secret:
      name: polaris-rsa-key-pair-secret
      publicKey: public.pem
      privateKey: private.pem

# -- Polaris CORS configuration.
cors:
  allowedOrigins: []
  allowedMethods: []
  allowedHeaders: []
  exposedHeaders: []
  accessControlMaxAge: ~
  accessControlAllowCredentials: ~

# -- Polaris rate limiter configuration.
rateLimiter:
  type: no-op
  tokenBucket:
    type: default
    requestsPerSecond: 9999
    window: PT10S

# -- Polaris asynchronous task executor configuration.
tasks:
  # -- The maximum number of concurrent tasks that can be executed at the same time. The default is the number of available cores.
  maxConcurrentTasks: ~  # 100
  # -- The maximum number of tasks that can be queued up for execution. The default is Integer.MAX_VALUE.
  maxQueuedTasks: ~  # 1000

minio:
  enabled: true
  endpoint: http://benchmarks-minio.datahub-hynix.svc.cluster.local:9000
  existingSecret: benchmarks-minio-credentials
  region: us-east-1
  warehouse: s3://data-catalog-bucket/
  accessKeyId: minioadmin
  secretAccessKey: minioadmin

  sts:
    enabled: false
    tokenDuration: 3600

# -- Grafana Dashboard: ConfigMap으로 대시보드 자동 프로비저닝
grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"   # Grafana sidecar가 감지하는 라벨
  annotations: {}